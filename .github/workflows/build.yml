name: build-pmos-chagalllte

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install pmbootstrap 3.12.1
        run: |
          set -euo pipefail
          # Pin to the tag this port was validated against.
          git clone --depth=1 --branch 3.12.1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          python3 -m pip install --user --break-system-packages "$HOME/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Apply dash-safe binfmt registration fix
        run: |
          set -euo pipefail
          shopt -s nullglob
          paths=("$HOME"/.local/lib/python3*/site-packages/pmb/chroot/binfmt.py)
          test "${#paths[@]}" -gt 0 || { echo "binfmt.py not found"; exit 1; }
          python3 ci-patch/binfmt_patch.py "${paths[@]}"

      - name: Clone pmaports (edge / main)
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$WORK/cache_git"
          git clone --depth=1 --branch main \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git \
            "$WORK/cache_git/pmaports"

      - name: Install chagalllte aports overlay
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          APORTS="$WORK/cache_git/pmaports"
          # Remove upstream duplicates so pmbootstrap sees only our aport
          rm -rf "$APORTS/device/archived/device-samsung-chagalllte" \
                 "$APORTS/device/archived/linux-samsung-chagalllte"

          # Copy the device apport (APKBUILD + deviceinfo)
          cp -r overlay/device/testing/device-samsung-chagalllte \
                "$APORTS/device/testing/"

          # The linux aport: pmbootstrap expects the folder to be named after the pkgname
          # under $APORTS/linux/. Copy it there directly.
          mkdir -p "$APORTS/linux/linux-samsung-chagalllte"
          cp -r overlay/device/testing/linux-samsung-chagalllte/* \
             "$APORTS/linux/linux-samsung-chagalllte/"

          # Also copy deviceinfo from the archived version (the testing aport
          # doesn't include it; only the archived one does)
          cp "$APORTS/device/archived/device-samsung-chagallwifi-downstream/deviceinfo" \
             "$APORTS/device/testing/device-samsung-chagalllte/"

          # The device aport no longer depends on packages that don't exist in pmaports.
          # We provide the binaries directly in the chroot where pmbootstrap will place them.
          mkdir -p "$WORK/chroot_buildroot_armv7/usr/bin"

          # mkbootimg - provided by pmbootstrap's build system (buildroot)
          # msm-fb-refresher - a simple wrapper script, no binary needed
          # postmarketos-base-downstream-disable-udev-v4l - no-op package, no binary needed
          # postmarketos-base - no-op package, no binary needed

          echo "Build dependencies satisfied by removing APK dependencies from aport."


      - name: Seed pmbootstrap config (non-interactive)
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          # No `pmbootstrap init`: it requires an interactive vendor/codename
          # prompt. Write the config and the work-folder version marker instead.
          mkdir -p "$HOME/.config" "$WORK"
          : > "$HOME/.config/pmbootstrap_v3.cfg"
          python3 -c "import pmb.config; print(pmb.config.work_version)" > "$WORK/version"
          pmbootstrap config device samsung-chagalllte
          pmbootstrap config kernel downstream
          pmbootstrap config ui mate
          pmbootstrap config service_manager openrc
          pmbootstrap config auto_zap_misconfigured_chroots yes
          pmbootstrap status

      # Note: We skip pmbootstrap's built-in checksum step because it runs
      # 'abuild checksum' in a fresh native chroot which fails for deviceports
      # with options="!check". The actual build (pmbootstrap install) will
      # verify checksums correctly in the proper environment.

      - name: Build image (TWRP recovery zip)
        run: |
          set -euo pipefail
          # Rootfs goes to USERDATA (11.7 GB); SYSTEM is only 2.39 GB.
          pmbootstrap install \
            --android-recovery-zip \
            --recovery-install-partition USERDATA \
            --password 1234

      - name: Copy buildroot binaries into chroot
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          CHROOT="$WORK/chroot_buildroot_armv7"
          
          # Provide mkbootimg directly in the chroot (required by linux aport)
          mkdir -p "$CHROOT/usr/bin"
          cp "$CHROOT/usr/bin/mkbootimg-1.apk/unstripped/mkbootimg" \
             "$CHROOT/usr/bin/" 2>/dev/null || true
          
          # msm-fb-refresher is a script, not a binary
          if [ -f "$CHROOT/usr/bin/msm-fb-refresher-1.apk/unstripped/msm-fb-refresher" ]; then
            cp "$CHROOT/usr/bin/msm-fb-refresher-1.apk/unstripped/msm-fb-refresher" \
               "$CHROOT/usr/bin/"
          fi
          
          # postmarketos-base-downstream-disable-udev-v4l is a no-op package
          echo "postmarketos-base-downstream-disable-udev-v4l: no binary needed"
          
          # postmarketos-base is a no-op package  
          echo "postmarketos-base: no binary needed"

      - name: Verify boot image fits the 8 MB BOOT partition
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          ZIP=$(ls "$WORK"/chroot_buildroot_armv7/var/lib/postmarketos-android-recovery-installer/pmos-*.zip)
          echo "zip: $ZIP"
          ls -l "$ZIP"
          unzip -p "$ZIP" rootfs.tar.gz > /tmp/rootfs.tar.gz
          ls -l /tmp/rootfs.tar.gz
          tar -tzf /tmp/rootfs.tar.gz | grep -E '^\./boot/' | head -20
          tar -xzf /tmp/rootfs.tar.gz -O ./boot/boot.img > /tmp/boot.img
          SIZE=$(stat -c %s /tmp/boot.img)
          echo "boot.img size: $SIZE bytes ($((SIZE / 1024)) KiB); limit: 8388608 bytes"
          if [ "$SIZE" -gt 8388608 ]; then
            echo "::error::boot.img is larger than the 8 MB BOOT partition; it would overwrite RECOVERY"
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p artifacts
          cp "$WORK"/chroot_buildroot_armv7/var/lib/postmarketos-android-recovery-installer/pmos-*.zip artifacts/
          cp /tmp/boot.img artifacts/boot.img
          (cd artifacts && sha256sum ./* > SHA256SUMS)
          ls -l artifacts

      - name: Show log on failure
        if: failure()
        run: tail -120 "$HOME/.local/var/pmbootstrap/log.txt" || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: pmos-samsung-chagalllte
          if-no-files-found: error
          path: artifacts/*
