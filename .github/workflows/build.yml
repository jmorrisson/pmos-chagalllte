name: build-pmos-chagalllte

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install pmbootstrap
        run: |
          set -euo pipefail
          git clone --depth=1 --branch 3.12.1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          python3 -m pip install --user --break-system-packages "$HOME/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Apply dash-safe binfmt registration fix
        run: |
          set -euo pipefail
          shopt -s nullglob
          paths=("$HOME"/.local/lib/python3*/site-packages/pmb/chroot/binfmt.py)
          test "${#paths[@]}" -gt 0 || { echo "binfmt.py not found"; exit 1; }
          python3 ci-patch/binfmt_patch.py "${paths[@]}"

      - name: Initialize pmbootstrap (defaults)
        run: |
          set -euo pipefail
          printf '\n%.0s' {1..40} > /tmp/pmb-init-answers
          pmbootstrap init < /tmp/pmb-init-answers
          pmbootstrap status

      - name: Install chagalllte aports overlay
        run: |
          set -euo pipefail
          APORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          # Upstream also has archived chagalllte packages with the same names;
          # remove them so pmbootstrap does not see duplicate aport folders.
          rm -rf "$APORTS/device/archived/device-samsung-chagalllte" \
                 "$APORTS/device/archived/linux-samsung-chagalllte"
          cp -r overlay/device/testing/. "$APORTS/device/testing/"
          pmbootstrap checksum device-samsung-chagalllte
          pmbootstrap config device samsung-chagalllte
          pmbootstrap config kernel downstream
          pmbootstrap config ui mate
          pmbootstrap config service_manager openrc
          pmbootstrap status

      - name: Build image (TWRP recovery zip)
        run: |
          set -euo pipefail
          # Rootfs goes to USERDATA (11.7 GB); SYSTEM is only 2.39 GB.
          pmbootstrap install \
            --android-recovery-zip \
            --recovery-install-partition USERDATA \
            --password 1234

      - name: Verify boot image fits the 8 MB BOOT partition
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          ZIP=$(ls "$WORK"/chroot_buildroot_armv7/var/lib/postmarketos-android-recovery-installer/pmos-*.zip)
          echo "zip: $ZIP"
          ls -l "$ZIP"
          unzip -p "$ZIP" rootfs.tar.gz | tar -xzO ./boot/boot.img > /tmp/boot.img
          SIZE=$(stat -c %s /tmp/boot.img)
          echo "boot.img size: $SIZE bytes ($((SIZE / 1024)) KiB); limit: 8388608 bytes"
          if [ "$SIZE" -gt 8388608 ]; then
            echo "::error::boot.img is larger than the 8 MB BOOT partition; it would overwrite RECOVERY"
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p artifacts
          cp "$WORK"/chroot_buildroot_armv7/var/lib/postmarketos-android-recovery-installer/pmos-*.zip artifacts/
          cp /tmp/boot.img artifacts/boot.img
          (cd artifacts && sha256sum ./* > SHA256SUMS)
          ls -l artifacts

      - name: Show log on failure
        if: failure()
        run: tail -120 "$HOME/.local/var/pmbootstrap/log.txt" || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: pmos-samsung-chagalllte
          if-no-files-found: error
          path: artifacts/*
